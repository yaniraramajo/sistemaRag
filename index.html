<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Rag</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="fixed-bottom p-4 d-flex flex-column align-items-end" style="z-index: 1050;">
        
        <div id="chatWindow" class="card shadow-lg mb-3 d-none" style="width: 320px; border-radius: 15px; overflow: hidden;">
            <div class="card-header text-white d-flex justify-content-between align-items-center">
                <span>Secretaría Virtual</span>
                <button type="button" class="btn-close btn-close-white" id="closeChat"></button>
            </div>
            <div class="card-body" style="height: 300px; overflow-y: auto; background-color: #f8f9fa;">
                <div class="mb-2">
                    <span class="badge bg-white text-dark p-2 shadow-sm" style="border-radius: 10px; white-space: normal; text-align: left;">
                        ¡Hola! 👋 Soy la secretaria virtual del colegio. ¿En qué puedo ayudarte?
                    </span>
                </div>
            </div>
            <div class="card-footer bg-white border-top-0">
                <div class="input-group">
                    <input type="text" class="form-control form-control-sm" placeholder="Escribe un mensaje...">
                    <button class="btn btn-primary btn-sm">Enviar</button>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-primary rounded-circle shadow-lg border-0 p-0 secretaria-btn"
            id="btnSecretaria" style="width: 80px; height: 80px; overflow: hidden; transition: all 0.3s ease;">
            <img src="img/SecretariaVirtual.png" alt="Secretaria" style="width: 100%; height: 100%; object-fit: cover;">
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
